<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!--
  A dashboard whose figures come from the owner's own systems (docs/examples/README.md,
  docs/spec.md "Live data from the owner's agents"). Plinth never fetches them: the owner's agent
  fetches with its own connectors and writes them here.

  Stored as shared data, in collection "issues" (declared sourced: only the owner and editors
  write it), one document per state, the document id being the state's id:
    - { count: number }, written by the owner's agent with a source stamp:
      write_artifact_data({ op: "set", collection: "issues", doc_id: "open", data: { count: 14 },
        if_rev, source: { id: "linear-issues", fetched_at } })
  The fetch is described once with set_data_sources (id "linear-issues", connector, a read-only
  recipe, collection "issues"), which the owner confirms in Plinth.

  Each figure carries a badge (plinth.cite) saying where it came from and how old it is, or "not
  fetched" when someone typed it. Badges are this page's code; the line under Plinth's bar,
  counted by the server from the stamps, is what readers can trust. An agent changes the states or
  their labels in STATES with update_artifact, and refreshes the figures when the user asks.
-->
<meta name="plinth-capabilities" content="data viewer">
<meta name="plinth-data-sourced" content="issues">
<title>Engineering issues</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --fg: #191c21;
    --muted: #5b6270;
    --border: #d5d9e0;
    --accent: #2f55a4;
    --bar: #e3e7ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151a;
      --panel: #1b1f26;
      --fg: #e6e9ee;
      --muted: #a2a9b6;
      --border: #333a45;
      --accent: #8fb0f0;
      --bar: #262c36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  h1 { margin: 0 0 0.25rem; font-size: 1.5rem; line-height: 1.25; }
  .lede { margin: 0 0 1.5rem; color: var(--muted); }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(12rem, 1fr));
    gap: 0.75rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .card {
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: 0.75rem;
    background: var(--panel);
  }
  .card h2 { margin: 0; color: var(--muted); font-size: 0.875rem; font-weight: 600; }
  .figure {
    display: block;
    margin-top: 0.25rem;
    font-size: 2rem;
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    overflow-wrap: anywhere;
  }
  .meter { height: 0.375rem; margin-top: 0.75rem; border-radius: 1rem; background: var(--bar); }
  .meter span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent); }
  .status { margin: 1.25rem 0 0; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <h1>Engineering issues</h1>
  <p class="lede">Issues in team ENG by state. Each figure says where it came from and when.</p>
  <ul class="grid" id="cards"></ul>
  <p class="status" id="status" role="status">Loading the figures…</p>
</main>
<script src="/__plinth/runtime.js"></script>
<script>
  // Decided in the HTML: the states shown, in order (ids are document ids in "issues").
  const STATES = [
    { id: "open", label: "Open" },
    { id: "in_progress", label: "In progress" },
    { id: "done", label: "Done this week" },
  ];

  const cards = document.getElementById("cards");
  const status = document.getElementById("status");
  const figures = new Map();
  for (const s of STATES) {
    const li = document.createElement("li");
    li.className = "card";
    const h = document.createElement("h2");
    h.textContent = s.label;
    const fig = document.createElement("strong");
    fig.className = "figure";
    fig.setAttribute("data-plinth-cite", `issues/${s.id}`);
    fig.textContent = "–";
    const meter = document.createElement("div");
    meter.className = "meter";
    const bar = document.createElement("span");
    meter.appendChild(bar);
    li.append(h, fig, meter);
    cards.appendChild(li);
    figures.set(s.id, { fig, bar });
  }

  function show(docs) {
    const counts = new Map();
    for (const d of docs) {
      const n = Number(d.data?.count);
      if (Number.isFinite(n) && n >= 0) counts.set(d.id, n);
    }
    const max = Math.max(1, ...counts.values());
    for (const s of STATES) {
      const f = figures.get(s.id);
      const n = counts.get(s.id);
      f.fig.textContent = n === undefined ? "–" : n.toLocaleString("en");
      f.bar.style.width = n === undefined ? "0" : `${Math.round((n / max) * 100)}%`;
    }
    window.plinth.cite.scan(document, { issues: docs });
    status.textContent = docs.length
      ? "Figures update on their own when the owner's agent fetches them again."
      : "No figures yet: the owner's agent writes them here when it fetches them.";
    document.body.dataset.ready = "1";
  }

  function unavailable(text) {
    status.textContent = text;
    document.body.dataset.ready = "1";
  }

  if (!window.plinth) {
    unavailable("The figures are not available here.");
  } else {
    window.plinth.ready.then((s) => {
      if (!s.available) {
        unavailable("The figures are not available on this server.");
        return;
      }
      window.plinth.db.collection("issues").onSnapshot(show, () => {
        unavailable("The figures could not be loaded. Reload the page to try again.");
      });
    });
  }
</script>
</body>
</html>
