name: Feature request
description: Suggest something Plinth should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or workflow, in your own words. What happens today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: Your idea, and anything you have seen elsewhere that does it well.
  - type: checkboxes
    id: pr
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
