# Weekly update PRs. The cooldown keeps to the rule in CONTRIBUTING.md: prefer releases at least a
# week old. Versions stay pinned exactly.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
