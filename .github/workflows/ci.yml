# Quality gates for every push and pull request: lint, typecheck, unit/integration tests, build,
# the client-bundle secret scan, the OpenAPI freshness check and the Playwright suite.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version (10.27.0) from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      # Same Node as `use-node-version` in .npmrc.
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: No secrets in the client bundle
        run: node scripts/check-bundle-secrets.mjs

      - name: docs/openapi.json is up to date
        run: pnpm openapi --check

      - name: Install Playwright Chromium
        run: pnpm --filter @plinth/e2e exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
